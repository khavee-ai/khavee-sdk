name: Publish SDK to NPM

# Publishes only the SDK packages (core, react, providers/*) that actually
# changed since the last successful publish. Never touches packages/wp-bundle
# (private, skipped by pnpm publish anyway) or wordpress-plugin/ (not part of
# the pnpm workspace at all).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to the major version used locally (lockfileVersion 9 / pnpm
      # 10.x observed) instead of "latest" — pnpm 11 requires Node >=22.13
      # (node:sqlite) and crashes outright on the Node 20 set up below.
      # Must run before actions/setup-node's cache:pnpm, which shells out to
      # `pnpm store path` to locate the cache directory.
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Diffs the whole range since the last successful publish (a moving
      # `sdk-published` tag), not just the latest commit — covers however
      # many commits/merges landed in between. Only checks each package's
      # own directory, so a change to core does NOT cascade a bump to
      # react/providers even though they depend on it via workspace:*.
      - name: Determine changed SDK packages
        id: changes
        run: |
          declare -A PKG_DIRS=(
            ["packages/core"]="@khaveeai/core"
            ["packages/react"]="@khaveeai/react"
            ["packages/providers/openai-realtime"]="@khaveeai/providers-openai-realtime"
            ["packages/providers/openai-stt-tts"]="@khaveeai/providers-openai-stt-tts"
            ["packages/providers/generic-stt-tts"]="@khaveeai/providers-generic-stt-tts"
            ["packages/providers/mock"]="@khaveeai/providers-mock"
            ["packages/providers/pgvector"]="@khaveeai/providers-pgvector"
            ["packages/providers/rag"]="@khaveeai/providers-rag"
            ["packages/providers/xai-realtime"]="@khaveeai/providers-xai-realtime"
          )

          if git rev-parse sdk-published >/dev/null 2>&1; then
            LAST_TAG="sdk-published"
            echo "Diffing against last publish marker: $LAST_TAG"
          else
            LAST_TAG=""
            echo "No sdk-published marker found — first run, treating all packages as changed"
          fi

          FILTERS=""
          BUILD_FILTERS=""
          DIRS=""
          for dir in "${!PKG_DIRS[@]}"; do
            name="${PKG_DIRS[$dir]}"
            if [ -z "$LAST_TAG" ] || ! git diff --quiet "$LAST_TAG"..HEAD -- "$dir"; then
              echo "Changed: $name ($dir)"
              FILTERS="$FILTERS --filter=$name"
              # "$name..." (pnpm's include-dependencies suffix) — a fresh CI
              # checkout has no packages/*/dist at all, and e.g.
              # providers-openai-realtime's own tsconfig resolves
              # @khaveeai/core via its published dist/index.d.ts
              # (package.json "types"), not source. Building with the exact,
              # no-"..." $FILTERS below only compiles the changed package
              # itself, so its workspace:* dependencies (core especially —
              # nearly everything depends on it) never get a dist and every
              # build fails with "Cannot find module '@khaveeai/core'" (found
              # live publishing v0.6.1). BUILD_FILTERS is ONLY for the build/
              # test steps; publishing still uses the exact $FILTERS below,
              # so an unchanged dependency never gets (re-)published just
              # because it was compiled as a side effect.
              BUILD_FILTERS="$BUILD_FILTERS --filter=$name..."
              DIRS="$DIRS $dir"
            fi
          done

          if [ -z "$FILTERS" ]; then
            echo "No SDK package changes since last publish — nothing to do."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "filters=$FILTERS" >> "$GITHUB_OUTPUT"
            echo "build_filters=$BUILD_FILTERS" >> "$GITHUB_OUTPUT"
            echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          fi

      # Neither `pnpm exec npm version` (npm chokes on the workspace:*
      # protocol these packages' internal @khaveeai/* deps use,
      # EUNSUPPORTEDPROTOCOL) nor `pnpm <filter> version` (pnpm treats
      # "version" as a missing package script when --filter is present, not
      # its own subcommand) work here — bump the version field directly.
      - name: Bump changed package versions (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && steps.changes.outputs.has_changes == 'true'
        run: |
          for dir in ${{ steps.changes.outputs.dirs }}; do
            current=$(jq -r .version "$dir/package.json")
            IFS='.' read -r major minor patch <<< "$current"
            case "${{ github.event.inputs.version_type }}" in
              major) new="$((major+1)).0.0" ;;
              minor) new="$major.$((minor+1)).0" ;;
              patch) new="$major.$minor.$((patch+1))" ;;
            esac
            echo "$dir: $current -> $new"
            jq --arg v "$new" '.version = $v' "$dir/package.json" > "$dir/package.json.tmp"
            mv "$dir/package.json.tmp" "$dir/package.json"
          done

      - name: Build changed packages (and their workspace dependencies)
        if: steps.changes.outputs.has_changes == 'true'
        run: pnpm ${{ steps.changes.outputs.build_filters }} run build

      - name: Run tests (changed packages + dependencies, skip if none)
        if: steps.changes.outputs.has_changes == 'true'
        # --if-present must precede the script name — placed after, pnpm
        # forwards it through as a CLI arg to the underlying test runner
        # (vitest) instead of consuming it itself, which then errors on an
        # unrecognized flag. build_filters (not filters) for the same
        # workspace-dependency reason as the build step above.
        run: pnpm ${{ steps.changes.outputs.build_filters }} run --if-present test

      # Commit the bump BEFORE publishing, not after — if publish then fails,
      # version numbers may skip ahead but git and npm never drift out of sync.
      - name: Commit and push version bump (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/react/package.json packages/providers/*/package.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump SDK package versions (${{ github.event.inputs.version_type }})"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish to NPM
        if: steps.changes.outputs.has_changes == 'true'
        run: pnpm ${{ steps.changes.outputs.filters }} publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Move the marker to HEAD so the next run's diff starts from here.
      - name: Move sdk-published marker
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git tag -f sdk-published
          git push origin sdk-published --force

      - name: Create GitHub Release (tag push only)
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
